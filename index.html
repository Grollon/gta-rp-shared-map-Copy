
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTA RP Shared Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root {
  --bg:#11151b;
  --panel:#1b222b;
  --line:#303b49;
  --text:#edf2f7;
  --muted:#9eacbb;
  --accent:#70d6a2;
}
* {box-sizing:border-box}
body {
  margin:0;background:var(--bg);color:var(--text);
  font:15px/1.45 system-ui,Segoe UI,Arial,sans-serif;
}
header {
  min-height:64px;padding:12px 18px;background:#171d25;
  border-bottom:1px solid var(--line);
  display:flex;gap:14px;align-items:center;
  justify-content:space-between;flex-wrap:wrap;
}
.brand {font-weight:800;letter-spacing:.06em}
.brand span {color:var(--accent)}
.tools {display:flex;gap:8px;align-items:center}
button {
  border:1px solid var(--line);background:#26313d;
  color:var(--text);padding:9px 12px;border-radius:8px;
  cursor:pointer;font-weight:650;
}
button:hover {border-color:var(--accent)}
button.primary {
  background:var(--accent);color:#102018;
  border-color:var(--accent);
}
#layout {
  display:grid;grid-template-columns:minmax(0,1fr) 330px;
  height:calc(100vh - 65px);min-height:520px;
}
#map {height:100%;background:#202a32}
aside {
  background:var(--panel);border-left:1px solid var(--line);
  padding:16px;overflow:auto;
}
h2 {font-size:17px;margin:0 0 10px}
.hint {color:var(--muted);font-size:13px;margin:0 0 14px}
.search {
  width:100%;padding:10px;background:#10161d;
  border:1px solid var(--line);border-radius:8px;
  color:var(--text);margin:0 0 12px;
}
#pinList {display:flex;flex-direction:column;gap:8px}
.pinrow {
  padding:10px;border:1px solid var(--line);border-radius:9px;
  background:#171e26;display:flex;gap:8px;align-items:center;
}
.pinrow .info {flex:1;min-width:0}
.pinrow strong {display:block;overflow-wrap:anywhere}
.pinrow small {color:var(--muted);display:block;overflow-wrap:anywhere}
.pinrow button {padding:5px 8px;font-size:12px}
.empty {
  color:var(--muted);padding:14px;
  border:1px dashed var(--line);border-radius:8px;
}
.modalback {
  position:fixed;inset:0;background:#0009;display:none;
  align-items:center;justify-content:center;
  padding:16px;z-index:2000;
}
.modal {
  width:min(480px,100%);max-height:90vh;overflow:auto;
  background:#1b222b;border:1px solid var(--line);
  border-radius:14px;padding:18px;
  box-shadow:0 18px 60px #0008;
}
label {display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
input,textarea {
  width:100%;padding:10px;border-radius:8px;
  border:1px solid var(--line);background:#10161d;
  color:var(--text);font:inherit;
}
textarea {min-height:85px;resize:vertical}
.modalactions {
  display:flex;justify-content:flex-end;gap:8px;margin-top:16px;
}
#status {font-size:12px;color:var(--muted);padding-top:14px}
.leaflet-popup-content-wrapper,.leaflet-popup-tip {
  background:#202a34;color:#edf2f7;
}

/* Seven icons cropped from the existing GTA image */
.icon-picker {
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:9px;margin:10px 0;
}
.icon-choice {
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:5px;min-height:82px;
  padding:6px;background:#10161d;
  border:2px solid var(--line);border-radius:9px;
}
.icon-choice.selected {
  border-color:var(--accent);background:#253b32;
}
.icon-choice small {font-size:11px;font-weight:500}

/* Each crop uses the original 820x708 image */
.gta-crop {
  width:46px;height:46px;position:relative;
  overflow:hidden;flex:none;
}
.gta-crop-inner {
  position:absolute;width:820px;height:708px;
  background-image:url("gta-blips.jpg");
  background-size:820px 708px;
  background-repeat:no-repeat;
}

/* Coloured map pins */
.map-marker {
  width:40px;height:40px;border:2px solid white;
  border-radius:50% 50% 50% 0;
  transform:rotate(-45deg);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 7px #0009;
  background:#70d6a2;
}
.marker-content {
  width:28px;height:28px;overflow:hidden;
  transform:rotate(45deg);
  position:relative;border-radius:50%;
}
.marker-content .gta-crop {
  position:absolute;top:0;left:0;
  transform:scale(.61);transform-origin:top left;
}
@media(max-width:800px) {
  #layout {
    grid-template-columns:1fr;
    grid-template-rows:minmax(360px,1fr) 270px;
    height:calc(100vh - 65px);
  }
  aside {border-left:0;border-top:1px solid var(--line)}
}
</style>
</head>
<body>
<header>
<div class="brand">SAN ANDREAS <span>RP</span> // SHARED MAP</div>
<div class="tools">
<button id="addBtn" class="primary">＋ Add location</button>
<button id="fitBtn">Show full map</button>
</div>
</header>

<div id="layout">
<div id="map"></div>
<aside>
<h2>Saved locations</h2>
<p class="hint">Shared locations added by the community.</p>
<input id="search" class="search" placeholder="Search locations…">
<div id="pinList"><div class="empty">Loading locations…</div></div>
<div id="status">Connecting to shared database…</div>
</aside>
</div>

<div class="modalback" id="modalBack">
<form class="modal" id="pinForm">
<h2 id="modalTitle">Add a location</h2>
<label for="pinTitle">Location name</label>
<input id="pinTitle" maxlength="80" required>
<label>Choose your GTA icon</label>
<div class="icon-picker" id="iconPicker"></div>
<label for="pinDescription">Description (optional)</label>
<textarea id="pinDescription" maxlength="1000"></textarea>
<div class="modalactions">
<button type="button" id="cancelBtn">Cancel</button>
<button type="submit" class="primary">Save pin</button>
</div>
</form>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// Existing Supabase project and public publishable key
const SUPABASE_URL = "https://iejsrhgzaxduldzxllnn.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_VomQiUSirJLQci_xNVlZ2w_gHHXs1fV";

const TILE_ROOT =
"https://viruxe.github.io/gtav-map-tiles/atlas/{z}/{x}-{y}.webp";

// Icon positions within gta-blips.jpg.
// Coordinates describe the top-left of each 46x46 crop.

const icons = [
  {id:"pill",name:"Pill",x:414,y:43},
  {id:"question",name:"Question",x:769,y:43},
  {id:"speech",name:"Speech",x:315,y:49},
  {id:"leaf",name:"Leaf",x:476,y:195},
  {id:"animal",name:"Animal",x:676,y:201},
  {id:"briefcase",name:"Briefcase",x:514,y:44},
  {id:"money",name:"Money",x:730,y:650}
];

const oldCategoryIcons = {
  mechanic:"pill",shop:"briefcase",garage:"briefcase",
  house:"briefcase",job:"briefcase",
  safehouse:"animal",atm:"money",general:"question"
};

const statusEl=document.getElementById("status");
const listEl=document.getElementById("pinList");
const searchEl=document.getElementById("search");
let supabaseClient;
let pins=[];
let markers=new Map();
let editingId=null;
let pendingPoint=null;
let selectedIcon="question";
let addMode=false;

const GTA_CRS=L.extend({},L.CRS.Simple,{
  transformation:new L.Transformation(1/32,0,1/32,0)
});
const map=L.map("map",{
  crs:GTA_CRS,minZoom:0,maxZoom:5,
  zoomSnap:.25,zoomDelta:.5
});
L.tileLayer(TILE_ROOT,{
  minZoom:0,maxZoom:5,noWrap:true,
  bounds:[[0,0],[8192,8192]],
  attribution:'Unofficial GTA V map tiles'
}).addTo(map);

const imageBounds=[[0,0],[8192,8192]];
map.fitBounds(imageBounds);
map.setMaxBounds([[-100,-100],[8292,8292]]);

function setStatus(message) {
  statusEl.textContent=message;
}
function escapeHtml(value) {
  return String(value??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  }[c]));
}
function getIcon(id) {
  const mapped=oldCategoryIcons[id]||id;
  return icons.find(i=>i.id===mapped)||icons[1];
}

function cropHTML(id) {
  const icon = getIcon(id);
  const index = icons.findIndex(i => i.id === icon.id);
  const position = index * 40;

  return `<div class="gta-crop"
    style="
      width:40px;
      height:40px;
      background-image:url('gta-seven-icons.png');
      background-repeat:no-repeat;
      background-size:280px 40px;
      background-position:-${position}px 0;
    ">
  </div>`;
}

function buildPicker() {
  const picker=document.getElementById("iconPicker");
  picker.innerHTML=icons.map(i=>`
    <button type="button" class="icon-choice"
      data-icon="${i.id}" title="${i.name}">
      ${cropHTML(i.id)}
      <small>${i.name}</small>
    </button>
  `).join("");
  picker.querySelectorAll("[data-icon]").forEach(button=>{
    button.addEventListener("click",()=>{
      selectedIcon=button.dataset.icon;
      updatePicker();
    });
  });
}
function updatePicker() {
  document.querySelectorAll(".icon-choice").forEach(button=>{
    button.classList.toggle(
      "selected",button.dataset.icon===selectedIcon
    );
  });
}
buildPicker();

function openModal(pin=null,point=null) {
  editingId=pin?.id??null;
  pendingPoint=point;
  selectedIcon=getIcon(pin?.category||"question").id;
  document.getElementById("modalTitle").textContent=
    pin?"Edit location":"Add a location";
  document.getElementById("pinTitle").value=pin?.title??"";
  document.getElementById("pinDescription").value=
    pin?.description??"";
  updatePicker();
  document.getElementById("modalBack").style.display="flex";
  document.getElementById("pinTitle").focus();
}
function closeModal() {
  document.getElementById("modalBack").style.display="none";
  editingId=null;
  pendingPoint=null;
}
document.getElementById("cancelBtn")
  .addEventListener("click",closeModal);
document.getElementById("modalBack")
  .addEventListener("click",e=>{
    if(e.target.id==="modalBack")closeModal();
  });
document.getElementById("addBtn")
  .addEventListener("click",()=>{
    addMode=true;
    setStatus("Click the map where you want the new pin.");
  });
document.getElementById("fitBtn")
  .addEventListener("click",()=>map.fitBounds(imageBounds));
map.on("click",e=>{
  if(addMode){
    addMode=false;
    openModal(null,e.latlng);
  }
});

document.getElementById("pinForm")
.addEventListener("submit",async e=>{
  e.preventDefault();
  if(!supabaseClient){
    alert("Database is not connected.");
    return;
  }
  const title=document.getElementById("pinTitle").value.trim();
  const description=document.getElementById("pinDescription").value.trim();
  if(!title)return;

  // The existing category column stores the icon choice.
  const payload={title,description,category:selectedIcon};

  if(!editingId){
    if(!pendingPoint)return;
    payload.x=Math.max(0,Math.min(1,pendingPoint.lng/8192));
    payload.y=Math.max(0,Math.min(1,pendingPoint.lat/8192));
  }

  const result=editingId
    ?await supabaseClient.from("pins").update(payload).eq("id",editingId)
    :await supabaseClient.from("pins").insert(payload);

  if(result.error){
    alert("Could not save pin: "+result.error.message);
    return;
  }
  closeModal();
  await loadPins();
  setStatus("Pin saved successfully.");
});

async function deletePin(id) {
  if(!confirm("Delete this location for everyone?"))return;
  const {error}=await supabaseClient
    .from("pins").delete().eq("id",id);
  if(error){
    alert("Could not delete pin: "+error.message);
    return;
  }
  await loadPins();
}

function render() {
  for(const marker of markers.values())map.removeLayer(marker);
  markers.clear();

  const query=searchEl.value.trim().toLowerCase();
  const shown=pins.filter(p=>
    (p.title+" "+(p.description||""))
      .toLowerCase().includes(query)
  );

  shown.forEach(pin=>{
    const icon=L.divIcon({
      className:"",
      html:`<div class="map-marker">
        <div class="marker-content">
          ${cropHTML(pin.category)}
        </div>
      </div>`,
      iconSize:[40,40],
      iconAnchor:[20,40],
      popupAnchor:[0,-36]
    });

    const marker=L.marker(
      [Number(pin.y)*8192,Number(pin.x)*8192],
      {icon}
    ).addTo(map);

    marker.bindPopup(
      `<strong>${escapeHtml(pin.title)}</strong><br>
      ${escapeHtml(getIcon(pin.category).name)}
      ${pin.description?
        `<br>${escapeHtml(pin.description)}`:""}`
    );
    markers.set(pin.id,marker);
  });

  listEl.innerHTML=shown.length?shown.map(p=>`
    <div class="pinrow">
      <div style="transform:scale(.7);width:34px;height:34px">
        ${cropHTML(p.category)}
      </div>
      <div class="info">
        <strong>${escapeHtml(p.title)}</strong>
        <small>${escapeHtml(getIcon(p.category).name)}</small>
        <small>${escapeHtml(p.description||"No description")}</small>
      </div>
      <button data-edit="${escapeHtml(p.id)}">Edit</button>
      <button data-delete="${escapeHtml(p.id)}">Delete</button>
    </div>
  `).join(""):'<div class="empty">No matching locations.</div>';

  listEl.querySelectorAll("[data-edit]").forEach(button=>{
    button.addEventListener("click",()=>{
      const pin=pins.find(p=>p.id===button.dataset.edit);
      if(pin)openModal(pin);
    });
  });
  listEl.querySelectorAll("[data-delete]").forEach(button=>{
    button.addEventListener("click",()=>{
      deletePin(button.dataset.delete);
    });
  });
}

searchEl.addEventListener("input",render);

async function loadPins() {
  const {data,error}=await supabaseClient
    .from("pins").select("*")
    .order("created_at",{ascending:true});
  if(error){
    setStatus("Database error: "+error.message);
    return;
  }
  pins=data||[];
  render();
  setStatus(`${pins.length} shared locations loaded.`);
}

(async function init(){
  try {
    supabaseClient=window.supabase.createClient(
      SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY
    );
    await loadPins();
    supabaseClient.channel("public-pins-changes")
      .on("postgres_changes",{
        event:"*",schema:"public",table:"pins"
      },()=>loadPins()).subscribe();
  }catch(err){
    setStatus("Connection error: "+err.message);
  }
})();
</script>
</body>
</html>
